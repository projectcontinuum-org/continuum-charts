{{- if .Values.continuum.apiServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "continuum-platform.api-server.fullname" . }}
  labels:
    {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "api-server" "extra" .Values.continuum.apiServer.labels.deployment) | nindent 4 }}
  {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.apiServer.annotations.deployment)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  replicas: {{ .Values.continuum.apiServer.replicas | default 1 }}
  {{- if eq (.Values.continuum.cacheStorage.accessMode | default "ReadWriteOnce") "ReadWriteOnce" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
      {{- include "continuum-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "api-server" "extra" .Values.continuum.apiServer.labels.pod) | nindent 8 }}
      {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.apiServer.annotations.pod)) }}
      annotations:
        {{- nindent 8 . }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-temporal
          image: "{{ .Values.global.initContainer.image.repository }}:{{ .Values.global.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.continuum.infra.temporal.host }} {{ .Values.continuum.infra.temporal.port }}; do
                echo "Waiting for Temporal..."; sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: wait-for-postgresql
          image: "{{ .Values.global.initContainer.image.repository }}:{{ .Values.global.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.continuum.infra.postgresql.host }} {{ .Values.continuum.infra.postgresql.port }}; do
                echo "Waiting for PostgreSQL..."; sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: wait-for-minio
          image: "{{ .Values.global.initContainer.image.repository }}:{{ .Values.global.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              MINIO_HOST=$(echo "{{ .Values.continuum.infra.minio.endpoint }}" | sed 's|http[s]*://||' | cut -d: -f1)
              MINIO_PORT=$(echo "{{ .Values.continuum.infra.minio.endpoint }}" | sed 's|http[s]*://||' | cut -d: -f2)
              MINIO_PORT=${MINIO_PORT:-9000}
              until nc -z $MINIO_HOST $MINIO_PORT; do
                echo "Waiting for MinIO..."; sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api-server
          image: "{{ .Values.continuum.apiServer.image.repository }}:{{ .Values.continuum.apiServer.image.tag | default .Values.global.continuumPlatformVersion | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: TEMPORAL_SERVER_ADDRESS
              value: {{ include "continuum-platform.infra.temporal.address" . | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.continuum.infra.temporal.namespace | quote }}
            - name: CONTINUUM_STORAGE_TYPE
              value: {{ .Values.continuum.storage.type | quote }}
            - name: CONTINUUM_MINIO_ENDPOINT
              value: {{ .Values.continuum.infra.minio.endpoint | quote }}
            - name: CONTINUUM_MINIO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.minio.secretName" . }}
                  key: root-user
            - name: CONTINUUM_MINIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.minio.secretName" . }}
                  key: root-password
            - name: CONTINUUM_CACHE_DIRECTORY
              value: "{{ .Values.continuum.cacheStorage.mountPath }}/workflow-data"
            - name: CONTINUUM_CACHE_BUCKET_NAME
              value: {{ .Values.continuum.storage.bucketName | quote }}
            - name: CONTINUUM_CACHE_BUCKET_REGION
              value: {{ .Values.continuum.storage.bucketRegion | quote }}
            - name: CONTINUUM_CACHE_BUCKET_BASE_PATH
              value: {{ .Values.continuum.storage.bucketBasePath | quote }}
            - name: CONTINUUM_DB_URL
              value: {{ include "continuum-platform.infra.db.url" . | quote }}
            - name: CONTINUUM_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.postgresql.secretName" . }}
                  key: username
            - name: CONTINUUM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.postgresql.secretName" . }}
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.continuum.apiServer.resources | nindent 12 }}
          volumeMounts:
            - name: cache-storage
              mountPath: {{ .Values.continuum.cacheStorage.mountPath }}
      volumes:
        - name: cache-storage
          persistentVolumeClaim:
            claimName: {{ include "continuum-platform.api-server.fullname" . }}-cache
      {{- with (.Values.continuum.apiServer.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.continuum.apiServer.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
