{{- if .Values.continuum.credentialsServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "continuum-platform.credentials-server.fullname" . }}
  labels:
    {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "credentials-server" "extra" .Values.continuum.credentialsServer.labels.deployment) | nindent 4 }}
  {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.credentialsServer.annotations.deployment)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  replicas: {{ .Values.continuum.credentialsServer.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: credentials-server
      {{- include "continuum-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "credentials-server" "extra" .Values.continuum.credentialsServer.labels.pod) | nindent 8 }}
      {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.credentialsServer.annotations.pod)) }}
      annotations:
        {{- nindent 8 . }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.global.initContainer.image.repository }}:{{ .Values.global.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.continuum.infra.postgresql.host }} {{ .Values.continuum.infra.postgresql.port }}; do
                echo "Waiting for PostgreSQL..."; sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: credentials-server
          image: "{{ .Values.continuum.credentialsServer.image.repository }}:{{ .Values.continuum.credentialsServer.image.tag | default .Values.global.continuumPlatformVersion | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: CONTINUUM_DB_URL
              value: {{ include "continuum-platform.infra.db.url" . | quote }}
            - name: CONTINUUM_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.postgresql.secretName" . }}
                  key: username
            - name: CONTINUUM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.postgresql.secretName" . }}
                  key: password
            - name: CREDENTIALS_ENCRYPTION_MASTER_KEY
              {{- if .Values.continuum.credentialsServer.existingEncryptionSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.continuum.credentialsServer.existingEncryptionSecret }}
                  key: master-key
              {{- else }}
              value: {{ .Values.continuum.credentialsServer.encryption.masterKey | quote }}
              {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.continuum.credentialsServer.resources | nindent 12 }}
      {{- with (.Values.continuum.credentialsServer.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.continuum.credentialsServer.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
