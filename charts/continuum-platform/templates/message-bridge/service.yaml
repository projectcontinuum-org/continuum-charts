{{- if .Values.continuum.messageBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum-platform.message-bridge.fullname" . }}
  labels:
    {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "message-bridge" "extra" .Values.continuum.messageBridge.labels.service) | nindent 4 }}
  {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.messageBridge.annotations.service)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.continuum.messageBridge.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: message-bridge
    {{- include "continuum-platform.selectorLabels" . | nindent 4 }}
{{- end }}
