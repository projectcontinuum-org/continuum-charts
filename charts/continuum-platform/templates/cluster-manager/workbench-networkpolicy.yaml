{{- if and .Values.continuum.clusterManager.enabled .Values.continuum.networkPolicy.workbenchIsolation.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: continuum-workbench-isolation
  namespace: {{ .Values.continuum.clusterManager.workbench.namespace }}
  labels:
    {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "cluster-manager" "extra" .Values.continuum.clusterManager.labels.networkPolicy) | nindent 4 }}
  {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.clusterManager.annotations.networkPolicy)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app: continuum-workbench
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.continuum.networkPolicy.workbenchIsolation.dns.namespace }}
          podSelector:
            matchLabels:
              {{- .Values.continuum.networkPolicy.workbenchIsolation.dns.podSelector | toYaml | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internet egress, deny cluster-internal (pod/service) CIDRs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.continuum.networkPolicy.workbenchIsolation.clusterInternalCIDRs | nindent 14 }}
{{- end }}
