{{- if .Values.continuum.clusterManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "continuum-platform.cluster-manager.fullname" . }}
  labels:
    app.kubernetes.io/component: cluster-manager
    {{- include "continuum-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.continuum.clusterManager.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: cluster-manager
      {{- include "continuum-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cluster-manager
        {{- include "continuum-platform.selectorLabels" . | nindent 8 }}
        {{- include "continuum-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "continuum-platform.cluster-manager.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.global.initContainer.image.repository }}:{{ .Values.global.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.continuum.infra.postgresql.host }} {{ .Values.continuum.infra.postgresql.port }}; do
                echo "Waiting for PostgreSQL..."; sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cluster-manager
          image: "{{ .Values.continuum.clusterManager.image.repository }}:{{ .Values.continuum.clusterManager.image.tag | default .Values.global.continuumPlatformVersion | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: CONTINUUM_DB_URL
              value: {{ include "continuum-platform.infra.db.url" . | quote }}
            - name: CONTINUUM_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.postgresql.secretName" . }}
                  key: username
            - name: CONTINUUM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "continuum-platform.postgresql.secretName" . }}
                  key: password
            - name: WORKBENCH_DEFAULT_IMAGE
              value: {{ .Values.continuum.clusterManager.workbench.defaultImage | quote }}
            - name: WORKBENCH_NAMESPACE
              value: {{ .Values.continuum.clusterManager.workbench.namespace | quote }}
            - name: WORKBENCH_IMAGE_PULL_POLICY
              value: {{ .Values.continuum.clusterManager.workbench.imagePullPolicy | default "IfNotPresent" | quote }}
            {{- if .Values.continuum.clusterManager.workbench.overlays.enabled }}
            - name: OVERLAY_ENABLED
              value: "true"
            - name: OVERLAY_PATH
              value: "/etc/continuum/overlays/workbench"
            {{- end }}
          {{- if .Values.continuum.clusterManager.workbench.overlays.enabled }}
          volumeMounts:
            - name: overlays
              mountPath: /etc/continuum/overlays/workbench
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.continuum.clusterManager.resources | nindent 12 }}
      {{- if .Values.continuum.clusterManager.workbench.overlays.enabled }}
      volumes:
        - name: overlays
          configMap:
            name: {{ include "continuum-platform.cluster-manager.fullname" . }}-overlays
      {{- end }}
      {{- with (.Values.continuum.clusterManager.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.continuum.clusterManager.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

