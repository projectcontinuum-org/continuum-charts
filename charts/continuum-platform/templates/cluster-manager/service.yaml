{{- if .Values.continuum.clusterManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum-platform.cluster-manager.fullname" . }}
  labels:
    {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "cluster-manager" "extra" .Values.continuum.clusterManager.labels.service) | nindent 4 }}
  {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.clusterManager.annotations.service)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.continuum.clusterManager.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: cluster-manager
    {{- include "continuum-platform.selectorLabels" . | nindent 4 }}
{{- end }}

