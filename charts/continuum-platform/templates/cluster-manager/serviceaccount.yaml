{{- if .Values.continuum.clusterManager.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "continuum-platform.cluster-manager.fullname" . }}
  labels:
    {{- include "continuum-platform.componentLabels" (dict "context" $ "component" "cluster-manager" "extra" .Values.continuum.clusterManager.labels.serviceAccount) | nindent 4 }}
  {{- with (include "continuum-platform.componentAnnotations" (dict "context" $ "extra" .Values.continuum.clusterManager.annotations.serviceAccount)) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
{{- end }}

